# Levanta la API y PostgreSQL:  docker compose up --build
# Antes: copia .env.example a .env y cambia la contraseña.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-originapi}
      POSTGRES_USER: ${POSTGRES_USER:-originapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - originapi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-originapi}
      DB_USER: ${POSTGRES_USER:-originapi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Solo accesible desde este equipo (127.0.0.1), no desde la red
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  originapi-data:
