spring.application.name=OriginApi

# --- Perfil por defecto: desarrollo con H2 en memoria (no deja nada en disco al parar la app) ---
spring.datasource.url=jdbc:h2:mem:originapi;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --- Paginación: tamaño máximo de página para evitar respuestas enormes ---
spring.data.web.pageable.max-page-size=50

# --- Documentación ---
springdoc.swagger-ui.path=/swagger-ui.html
